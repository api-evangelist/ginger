name: Ginger
description: >-
  Ginger (formerly Ginger.io) was a behavioral and emotional health company
  offering on-demand mental health support — coaching, therapy, and psychiatry —
  delivered through a mobile app and an employer/health-plan benefits model.
  Surfaced in the API Evangelist network as a Techstars portfolio lead, Ginger
  merged with Headspace in 2021 to form Headspace Health; the ginger.com domain
  now redirects to Headspace for Organizations (organizations.headspace.com).
  Enrichment probing on 2026-07-19 found no independent public API, developer
  portal, OpenAPI, SDKs, or /.well-known discovery surface — every /.well-known
  path resolves to a soft-404 Headspace marketing page. This profile is retained
  as an acquired-company record; the only genuine machine-derivable artifact is
  the live domain-security posture of ginger.com.
